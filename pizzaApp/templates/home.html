{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container text-center mt-5">
        <h1 class="display-3 text-danger">Welcome to PizzaMin 🍕</h1>
        <p class="lead">The best pizza in town, delivered to your doorstep!</p>
        {% if user.is_authenticated %}
            <!-- Go straight through to last order-->
            <a href="{% url 'pizza_list' %}" class="btn btn-warning btn-lg">Order Now</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-warning btn-lg">Order Now</a>
        {% endif %}
    </div>

    <br>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <img src="{% static 'images/pizza1.jpg' %}" alt="Image 1" class="img-fluid rounded">
            </div>
            <div class="col-md-4">
                <img src="{% static 'images/pizza2.jpg' %}" alt="Image 2" class="img-fluid rounded">
            </div>
            <div class="col-md-4">
                <img src="{% static 'images/pizza3.jpg' %}" alt="Image 3" class="img-fluid rounded">
            </div>
        </div>
    </div>
{% endblock %}
